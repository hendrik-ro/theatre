services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    command: node packages/server/dist/db/migrate.js
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db: { condition: service_healthy }

  app:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - logs:/app/data
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  logs:
